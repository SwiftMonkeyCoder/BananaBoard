services:
  app:
    build:
      context: .
      target: development
    command: pnpm dev
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_uploads:/app/data/uploads

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bananaboard}
      POSTGRES_USER: ${POSTGRES_USER:-bananaboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bananaboard}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dev_node_modules:
  dev_uploads:
  dev_postgres_data:
